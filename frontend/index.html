<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="TweetLens dips a tweet like litmus paper: four sentiment models, a step-by-step view of what they read, and the words that swayed them." />
    <meta name="theme-color" content="#F2F4F3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1B2025" media="(prefers-color-scheme: dark)" />
    <title>TweetLens</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Apply a saved theme before first paint so the page never flashes.
      try {
        var saved = localStorage.getItem("tweetlens-theme");
        if (saved === "light" || saved === "dark") document.documentElement.dataset.theme = saved;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
