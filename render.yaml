# Render Blueprint: the TweetLens API.
# The build downloads TweetEval and trains every model (about 3 minutes);
# the trained models are not stored in git.
services:
  - type: web
    name: tweetlens-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python -m tweetlens.train
    startCommand: uvicorn tweetlens.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # The Netlify site's URL, e.g. https://tweetlens.netlify.app
      - key: TWEETLENS_CORS_ORIGINS
        sync: false
