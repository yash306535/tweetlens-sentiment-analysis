# Netlify: the TweetLens web app.
# Set VITE_API_BASE in the site's environment variables to the Render API URL,
# e.g. https://tweetlens-api.onrender.com
[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: every path loads index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
